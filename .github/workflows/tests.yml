name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Laravel 13.* is intentionally excluded for now: pestphp/pest-plugin-laravel
        # has no released version yet that supports it (latest, v3.2.0, only
        # allows laravel/framework ^11.39.1|^12.9.2), so `composer update`
        # cannot resolve under 13.* today — this is a test-tooling gap, not a
        # known incompatibility in this package's own code (its own
        # illuminate/*/orchestra-testbench constraints already allow ^13.0).
        # Re-add '13.*' here once pest-plugin-laravel ships Laravel 13 support.
        laravel: ['11.*', '12.*']

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, redis
          coverage: none

      - name: Require the Laravel version under test
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install dependencies
        run: |
          # Composer's install-time security audit excludes any package
          # version affected by a known advisory from dependency resolution
          # entirely (not just a warning) — and every laravel/framework
          # 11.x release currently has at least one open advisory, which
          # would otherwise make 11.x uninstallable here regardless of PHP
          # version. This CI matrix only exercises compatibility, it never
          # publishes/deploys anything, so disable that gate for this step;
          # `composer audit` still runs standalone if we ever want the report.
          composer config audit.block-insecure false --no-interaction
          composer update --prefer-dist --no-interaction --prefer-stable

      - name: Run tests
        run: vendor/bin/pest --colors=always

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --prefer-stable

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
